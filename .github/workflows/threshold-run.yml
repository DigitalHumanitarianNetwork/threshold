name: Threshold run
on:
  workflow_dispatch:
    inputs:
      question_limit:
        description: 'Only use the first N questions (0 = all)'
        default: '0'
      field:
        description: 'Field to run (its questions tab in the private sheet)'
        default: 'humanitarian'
      model:
        description: 'Run only this model id (empty = all enabled models)'
        default: ''
concurrency: threshold-run
permissions:
  contents: write
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
      - name: Run questions and score
        env:
          SHEETS_TOKEN: ${{ steps.auth.outputs.access_token }}
          THRESHOLD_SHEET_ID: ${{ vars.THRESHOLD_SHEET_ID }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          QUESTION_LIMIT: ${{ inputs.question_limit }}
          FIELD: ${{ inputs.field }}
          MODEL: ${{ inputs.model }}
        run: node scripts/run.mjs
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet || (git commit -m "Threshold run results" && git push)
